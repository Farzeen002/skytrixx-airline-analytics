<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyTrixx — Airline Commercial Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --ink: #0a1b2e;
  --ink-soft: #243447;
  --mist: #e8f0f4;
  --cloud: #f3f6f9;
  --panel: #ffffff;
  --panel-solid: #ffffff;
  --line: rgba(10, 27, 46, 0.1);
  --teal: #0e7c7b;
  --teal-deep: #0a5c5b;
  --steel: #1a4f6b;
  --blue: #2563eb;
  --copper: #b85c38;
  --forest: #3d6b4f;
  --muted: #5c6b7a;
  --shadow: 0 10px 28px rgba(10, 27, 46, 0.06);
  --radius: 14px;
  --font-display: 'Bricolage Grotesque', Georgia, serif;
  --font-body: 'Figtree', system-ui, sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: var(--font-body);
  background: linear-gradient(180deg, #e8eef5 0%, var(--cloud) 28%, #eef2f6 100%);
  background-attachment: fixed;
}

#app {
  position: relative;
  width: min(1280px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 1rem 0 3.5rem;
}

.floating-tabs {
  display: flex;
  flex-wrap: nowrap;
  align-items: stretch;
  gap: 0.35rem;
  padding: 0.35rem;
  margin-bottom: 1rem;
  background: rgba(255, 255, 255, 0.92);
  border: 1px solid var(--line);
  border-radius: 999px;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0.65rem;
  z-index: 20;
  backdrop-filter: blur(10px);
  animation: rise 0.55s ease both;
}

.ftab {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  padding: 0.55rem 0.5rem;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, box-shadow 0.15s ease;
  white-space: nowrap;
  flex: 1 1 0;
  text-align: center;
  min-width: 0;
}

.ftab:hover {
  background: rgba(37, 99, 235, 0.08);
  color: var(--blue);
}

.ftab.is-active {
  background: var(--blue);
  color: #fff;
  box-shadow: 0 6px 16px rgba(37, 99, 235, 0.28);
}

.period-bar:not(:empty) {
  margin-bottom: 0.85rem;
  padding: 0.75rem 0.9rem;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
}

.picker-help {
  margin: 0.55rem 0 0.55rem;
  font-size: 0.82rem;
  color: var(--muted);
}

.week-picker {
  margin-top: 0.15rem;
}

.week-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0.55rem;
}

.week-card {
  appearance: none;
  text-align: left;
  border: 1px solid var(--line);
  background: #f8fafc;
  border-radius: 12px;
  padding: 0.75rem 0.85rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
}

.week-card:hover:not(:disabled) {
  border-color: rgba(37, 99, 235, 0.4);
  background: #fff;
}

.week-card.is-active {
  background: #eff6ff;
  border-color: var(--blue);
  box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.25);
}

.week-card.is-empty,
.week-card:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.week-card-id {
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--ink);
}

.week-card.is-active .week-card-id {
  color: var(--blue);
}

.week-card-dates {
  font-size: 0.8rem;
  color: var(--muted);
  font-weight: 600;
}

.week-card-stat {
  font-size: 0.75rem;
  color: var(--ink-soft);
  margin-top: 0.25rem;
}

.viewing-banner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
  margin-bottom: 1rem;
  padding: 0.85rem 1rem;
  background: #eff6ff;
  border: 1px solid rgba(37, 99, 235, 0.22);
  border-radius: 12px;
  animation: rise 0.4s ease both;
}

.viewing-main {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0.45rem 0.65rem;
}

.viewing-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--blue);
}

.viewing-main strong {
  font-size: 1.05rem;
  letter-spacing: -0.02em;
}

.viewing-range {
  color: var(--muted);
  font-size: 0.88rem;
  font-weight: 500;
}

.viewing-meta {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--ink-soft);
}

.link-clear {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--blue);
  font: inherit;
  font-size: 0.84rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  padding: 0;
}

.week-table tr.is-active-row {
  background: rgba(37, 99, 235, 0.08);
}

.week-table tr.is-empty-row {
  opacity: 0.45;
}

.week-table tr[data-week-row]:not(.is-empty-row):hover {
  background: rgba(37, 99, 235, 0.05);
}

.period-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.65rem;
  margin-bottom: 0.45rem;
}

.period-bar .period-row:last-child {
  margin-bottom: 0;
}

.period-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem;
}

.period-label {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-right: 0.25rem;
}

.period-hint {
  margin: 0;
  font-size: 0.78rem;
  color: var(--muted);
}

.period-sub {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-bottom: 0.35rem;
}

.period-sub.month-strip {
  gap: 0.2rem;
  padding: 0.3rem;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  width: fit-content;
  max-width: 100%;
}

.period-sub.month-strip .chip {
  border: 0;
  background: transparent;
  min-width: 2.5rem;
  justify-content: center;
  border-radius: 8px;
}

.period-sub.month-strip .chip.is-active {
  background: var(--blue);
  color: #fff;
  border-color: transparent;
}

.period-sub.month-strip .chip.is-empty {
  opacity: 0.45;
}

.period-sub.month-strip .chip.is-empty.is-active {
  opacity: 1;
  background: var(--blue);
  color: #fff;
}

.chip {
  appearance: none;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink-soft);
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.35rem 0.7rem;
  border-radius: 999px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}

.chip:hover {
  border-color: rgba(37, 99, 235, 0.35);
  color: var(--blue);
}

.chip.is-active {
  background: rgba(37, 99, 235, 0.1);
  border-color: rgba(37, 99, 235, 0.45);
  color: var(--blue);
}

.chip.chip-clear {
  margin-left: 0.15rem;
  color: var(--muted);
}

.chip.sub.is-empty {
  opacity: 0.55;
}

.chip.sub.is-empty.is-active {
  opacity: 1;
  background: rgba(184, 92, 56, 0.1);
  border-color: rgba(184, 92, 56, 0.35);
  color: var(--copper);
}

.top-filters {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  align-items: center;
  justify-content: flex-end;
}

.filter-pill {
  border: 1px solid var(--line);
  background: #fff;
  padding: 0.4rem 0.75rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-soft);
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 0.75rem;
  align-items: flex-start;
  margin-bottom: 1rem;
  animation: rise 0.55s ease both;
}

.page-head h1 {
  margin: 0 0 0.25rem;
  font-family: var(--font-display);
  font-size: clamp(1.55rem, 3vw, 1.95rem);
  letter-spacing: -0.03em;
}

.page-head p {
  margin: 0;
  color: var(--muted);
  font-size: 0.92rem;
}


.view {
  animation: rise 0.45s ease both;
}

.empty-state {
  background: rgba(37, 99, 235, 0.05);
  border: 1px solid rgba(37, 99, 235, 0.18);
  color: var(--ink-soft);
  border-radius: 12px;
  padding: 0.85rem 1rem;
  margin-bottom: 1rem;
  font-size: 0.88rem;
  font-weight: 600;
}

.signal-list {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
}

.signal {
  border: 1px solid var(--line);
  border-left-width: 4px;
  border-radius: 10px;
  padding: 0.75rem 0.85rem;
  background: #fafcfd;
}

.signal.warn { border-left-color: var(--copper); }
.signal.info { border-left-color: var(--blue); }

.signal strong {
  display: block;
  font-size: 0.9rem;
  margin-bottom: 0.25rem;
}

.signal p {
  margin: 0;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.4;
}

.kpi-strip.light {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.kpi-strip.light.four {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.kpi-strip.light .kpi {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.9rem 1rem;
  box-shadow: var(--shadow);
  color: var(--ink);
}

.kpi-strip.light .kpi .label {
  color: var(--muted);
}

.kpi-strip.light .kpi .value {
  color: var(--ink);
  font-family: var(--font-display);
  font-size: clamp(1.15rem, 2.2vw, 1.45rem);
  font-weight: 700;
  letter-spacing: -0.03em;
}

.kpi-strip.light .kpi .hint {
  color: var(--muted);
}

.kpi-strip.light .kpi.accent {
  border-color: rgba(14, 124, 123, 0.35);
  background: linear-gradient(180deg, #f2fbfb, #fff);
}

.kpi-strip.light .kpi.accent .value {
  color: var(--teal-deep);
}

.kpi-strip.light .kpi.muted-kpi .value {
  color: var(--muted);
  font-size: 1.15rem;
}

.vbar-chart {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 0.35rem;
  align-items: end;
  min-height: 180px;
  padding-top: 0.5rem;
}

.vbar-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  min-width: 0;
}

.vbar-val {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
}

.vbar-track {
  width: 100%;
  height: 120px;
  display: flex;
  align-items: flex-end;
  background: rgba(10, 27, 46, 0.04);
  border-radius: 8px 8px 4px 4px;
  overflow: hidden;
}

.vbar-fill {
  width: 100%;
  height: 0;
  border-radius: inherit;
  background: var(--steel);
  animation: growH 0.85s 0.15s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.vbar-col.is-highlight .vbar-fill {
  background: var(--teal);
}

.vbar-col.is-muted .vbar-fill {
  background: rgba(26, 79, 107, 0.28);
}

.vbar-col.is-highlight .vbar-val {
  color: var(--teal-deep);
}

.vbar-label {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--muted);
}

.pipeline.vertical {
  flex-direction: column;
  align-items: stretch;
}

.pipeline.vertical .pipe-arrow {
  display: none;
}

.sig-ok { color: var(--forest); font-weight: 700; }
.sig-mid { color: var(--muted); font-weight: 700; }
.sig-bad { color: var(--copper); font-weight: 700; }

@keyframes growH {
  from { height: 0; }
  to { height: var(--h); }
}

.callout {
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid var(--line);
  border-left: 4px solid var(--teal);
  border-radius: 16px;
  padding: 1.1rem 1.2rem 1.2rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow);
  animation: rise 0.75s 0.06s ease both;
}

.callout-title {
  font-family: var(--font-display);
  font-size: 1.05rem;
  font-weight: 700;
  margin-bottom: 0.75rem;
  letter-spacing: -0.02em;
}

.callout-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.9rem;
}

.callout-grid strong {
  display: block;
  margin-bottom: 0.3rem;
  font-size: 0.9rem;
}

.callout-grid p {
  margin: 0;
  color: var(--muted);
  font-size: 0.86rem;
  line-height: 1.45;
}

.callout-grid b {
  color: var(--ink);
}

.section-head {
  margin: 1.35rem 0 0.75rem;
  animation: rise 0.7s ease both;
}

.section-head h2 {
  margin: 0 0 0.3rem;
  font-family: var(--font-display);
  font-size: 1.45rem;
  letter-spacing: -0.03em;
}

.section-head p {
  margin: 0;
  color: var(--muted);
  font-size: 0.92rem;
  line-height: 1.5;
  max-width: 52rem;
}

.metric-row.defs {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.metric em {
  display: block;
  margin-top: 0.45rem;
  font-style: normal;
  color: var(--muted);
  font-size: 0.76rem;
  line-height: 1.4;
  font-weight: 500;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.stack-row {
  display: grid;
  grid-template-columns: 11rem 1fr 5rem;
  gap: 0.65rem;
  align-items: center;
  font-size: 0.86rem;
}

.stack-track {
  height: 12px;
  border-radius: 999px;
  background: rgba(10, 27, 46, 0.08);
  overflow: hidden;
}

.stack-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  animation: grow 0.9s 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.stack-fill.c-ticket { background: var(--steel); }
.stack-fill.c-anc { background: var(--teal); }
.stack-fill.c-tax { background: var(--copper); }

.stack-row strong {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.fact-list {
  margin: 0;
  padding-left: 1.1rem;
  color: var(--ink-soft);
  font-size: 0.86rem;
  line-height: 1.55;
}

.note-inline {
  margin: 0.85rem 0 0;
  color: var(--muted);
  font-size: 0.8rem;
}

.cell-sub {
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 500;
  margin-top: 0.1rem;
}

.pipeline {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
  margin-bottom: 1rem;
}

.pipe-step {
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.65rem 0.8rem;
  min-width: 5.5rem;
}

.pipe-step span {
  display: block;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 0.2rem;
}

.pipe-step strong {
  font-family: var(--font-display);
  font-size: 1.1rem;
  letter-spacing: -0.02em;
}

.pipe-step.accent {
  border-color: rgba(14, 124, 123, 0.35);
  background: rgba(14, 124, 123, 0.08);
}

.pipe-arrow {
  color: var(--muted);
  font-weight: 700;
}

.table-wrap.tight table {
  min-width: 0;
}

.glossary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.g-card {
  background: rgba(255, 255, 255, 0.78);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.85rem 0.95rem;
  box-shadow: var(--shadow);
}

.g-card strong {
  display: block;
  font-family: var(--font-display);
  font-size: 0.95rem;
  letter-spacing: -0.02em;
  margin-bottom: 0.3rem;
}

.g-card p {
  margin: 0;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.4;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1.5rem;
  animation: rise 0.7s ease both;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  background: var(--blue);
  display: grid;
  place-items: center;
  color: #fff;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.05rem;
  letter-spacing: -0.03em;
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.brand-text strong {
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.brand-text span {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 500;
}

.badge {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(8px);
  padding: 0.45rem 0.8rem;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--ink-soft);
}

.hero {
  position: relative;
  overflow: hidden;
  border-radius: 28px;
  padding: clamp(1.6rem, 4vw, 2.6rem);
  background:
    linear-gradient(135deg, rgba(10, 27, 46, 0.96), rgba(26, 79, 107, 0.92) 55%, rgba(14, 124, 123, 0.88)),
    var(--ink);
  color: #f4f8fa;
  box-shadow: var(--shadow);
  animation: rise 0.8s 0.05s ease both;
  margin-bottom: 1.25rem;
}

.hero::after {
  content: '';
  position: absolute;
  width: 420px;
  height: 420px;
  right: -80px;
  top: -120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232, 242, 244, 0.18), transparent 65%);
  animation: drift 10s ease-in-out infinite alternate;
}

.hero-copy {
  position: relative;
  z-index: 1;
  max-width: 38rem;
}

.hero h1 {
  margin: 0 0 0.65rem;
  font-family: var(--font-display);
  font-size: clamp(2rem, 5vw, 3.15rem);
  line-height: 1.05;
  letter-spacing: -0.04em;
  font-weight: 800;
}

.hero p {
  margin: 0;
  max-width: 34rem;
  color: rgba(244, 248, 250, 0.82);
  font-size: 1.02rem;
  line-height: 1.55;
}

.kpi-strip {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 0.75rem;
  margin-top: 1.75rem;
}

.kpi {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 0.9rem 1rem;
  backdrop-filter: blur(6px);
}

.kpi .label {
  display: block;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: rgba(244, 248, 250, 0.65);
  margin-bottom: 0.35rem;
  font-weight: 600;
}

.kpi .value {
  font-family: var(--font-display);
  font-size: clamp(1.2rem, 2.4vw, 1.55rem);
  font-weight: 700;
  letter-spacing: -0.03em;
}

.kpi .hint {
  display: block;
  margin-top: 0.2rem;
  font-size: 0.75rem;
  color: rgba(244, 248, 250, 0.58);
}

.grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 1rem;
  margin-bottom: 1rem;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
  margin-bottom: 1rem;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  backdrop-filter: blur(10px);
  box-shadow: var(--shadow);
  padding: 1.15rem 1.2rem 1.25rem;
  animation: rise 0.75s ease both;
}

.panel:nth-child(1) { animation-delay: 0.08s; }
.panel:nth-child(2) { animation-delay: 0.12s; }
.panel:nth-child(3) { animation-delay: 0.16s; }
.panel:nth-child(4) { animation-delay: 0.2s; }

.panel h2 {
  margin: 0 0 0.25rem;
  font-family: var(--font-display);
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}

.panel .sub {
  margin: 0 0 1rem;
  color: var(--muted);
  font-size: 0.88rem;
}

.hbar-list {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.hbar-row {
  display: grid;
  grid-template-columns: 5.5rem 1fr 3.2rem;
  gap: 0.65rem;
  align-items: center;
}

.hbar-label {
  display: flex;
  flex-direction: column;
  gap: 0.1rem;
  font-weight: 600;
  font-size: 0.86rem;
}

.hbar-label small {
  color: var(--muted);
  font-weight: 500;
  font-size: 0.72rem;
}

.hbar-track {
  height: 10px;
  border-radius: 999px;
  background: rgba(10, 27, 46, 0.08);
  overflow: hidden;
}

.hbar-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--c, var(--teal));
  animation: grow 0.9s 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.hbar-value {
  text-align: right;
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--ink-soft);
}

.donut-wrap {
  display: grid;
  grid-template-columns: 150px 1fr;
  gap: 1rem;
  align-items: center;
  position: relative;
}

.donut-svg {
  width: 150px;
  height: 150px;
}

.donut-slice {
  transition: stroke-width 0.2s ease;
}

.donut-center {
  position: absolute;
  left: 0;
  width: 150px;
  height: 150px;
  display: grid;
  place-content: center;
  text-align: center;
  pointer-events: none;
}

.donut-center strong {
  font-family: var(--font-display);
  font-size: 1.15rem;
  letter-spacing: -0.02em;
}

.donut-center span {
  font-size: 0.72rem;
  color: var(--muted);
}

.donut-legend {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
}

.donut-legend li {
  display: grid;
  grid-template-columns: 10px 1fr auto;
  gap: 0.55rem;
  align-items: center;
  font-size: 0.86rem;
}

.swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.leg-label {
  color: var(--ink-soft);
}

.leg-value {
  font-weight: 700;
}

.load-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.7rem;
}

.load-cell {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.75rem 0.85rem;
  background: rgba(255, 255, 255, 0.55);
}

.load-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 0.15rem;
}

.load-top strong {
  font-family: var(--font-display);
  letter-spacing: -0.02em;
}

.load-top span {
  font-weight: 700;
  font-size: 0.92rem;
}

.load-route {
  color: var(--muted);
  font-size: 0.75rem;
  margin-bottom: 0.45rem;
}

.load-track {
  height: 7px;
  border-radius: 999px;
  background: rgba(10, 27, 46, 0.08);
  overflow: hidden;
}

.load-fill {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--teal);
  animation: grow 0.85s 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.tone-high .load-fill { background: var(--forest); }
.tone-mid .load-fill { background: var(--teal); }
.tone-low .load-fill { background: var(--copper); }
.tone-high .load-top span { color: var(--forest); }
.tone-mid .load-top span { color: var(--teal-deep); }
.tone-low .load-top span { color: var(--copper); }

.metric-row {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.metric {
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 0.85rem 0.95rem;
  background: rgba(255, 255, 255, 0.55);
}

.metric span {
  display: block;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 0.25rem;
}

.metric strong {
  font-family: var(--font-display);
  font-size: 1.25rem;
  letter-spacing: -0.02em;
}

.table-wrap {
  overflow: auto;
  border-radius: 14px;
  border: 1px solid var(--line);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.86rem;
  min-width: 720px;
}

th,
td {
  padding: 0.7rem 0.8rem;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}

th {
  background: rgba(10, 27, 46, 0.04);
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  font-weight: 700;
}

tbody tr:hover {
  background: rgba(14, 124, 123, 0.05);
}

td.num {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.lf-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 3.2rem;
  padding: 0.2rem 0.45rem;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.8rem;
}

.lf-pill.high { background: rgba(61, 107, 79, 0.15); color: var(--forest); }
.lf-pill.mid { background: rgba(14, 124, 123, 0.14); color: var(--teal-deep); }
.lf-pill.low { background: rgba(184, 92, 56, 0.14); color: var(--copper); }

.footer-note {
  margin-top: 1.25rem;
  color: var(--muted);
  font-size: 0.82rem;
  text-align: center;
  animation: rise 0.8s 0.25s ease both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes grow {
  from { width: 0; }
  to { width: var(--w); }
}

@keyframes drift {
  from { transform: translate(0, 0); }
  to { transform: translate(-30px, 24px); }
}

@media (max-width: 960px) {
  .floating-tabs {

                  <td><strong>${m.route}</strong></td>
                  <td class="num">${number(m.count)}</td>
                  <td class="num">${number(m.operated)}</td>
                  <td class="num">${number(m.flown)}</td>
                  <td><span class="lf-pill ${lfTone(m.lf)}">${Math.round(m.lf * 100)}%</span></td>
                  <td class="${cls}">${signal}</td>
                </tr>`;
    }).join("")}
          </tbody>
        </table>
      </div>
    </section>
  `;
  }
  function renderView() {
    const view = document.querySelector("#view");
    if (!view) return;
    const map = {
      overview: viewOverview,
      network: viewNetwork,
      capacity: viewCapacity,
      revenue: viewRevenue,
      forecast: viewForecast
    };
    view.innerHTML = map[state.tab]();
    bindClearButtons(view);
    view.querySelectorAll("[data-week-row]").forEach((row) => {
      const id = row.dataset.weekRow;
      if (!id || row.classList.contains("is-empty-row")) return;
      row.style.cursor = "pointer";
      row.addEventListener("click", () => {
        state.grain = "weekly";
        state.week = id;
        state.month = null;
        render();
      });
    });
  }
  function render() {
    syncPeriodToTab();
    const app = document.querySelector("#app");
    if (!app?.querySelector(".floating-tabs")) {
      renderShell();
    } else {
      app.querySelectorAll("[data-tab]").forEach((btn) => {
        const active = btn.dataset.tab === state.tab;
        btn.classList.toggle("is-active", active);
        btn.setAttribute("aria-selected", String(active));
      });
    }
    renderPeriodBar();
    renderView();
  }
  render();
})();

  </script>
</body>
</html>
